---
layout: default
---

<!-- 引入渲染库 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- 视觉装饰背景 -->
<div class="lab-bg-ornaments">
  <div class="mesh-gradient"></div>
  <div class="dot-grid"></div>
</div>

<div id="ai-lab-wrapper" class="ai-lab-container">
  <!-- 顶部导航：磨砂玻璃效果 -->
  <header class="lab-header">
    <div class="lab-logo">
      <svg viewBox="0 0 100 100" class="logo-icon">
        <defs>
          <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1677ff" />
            <stop offset="100%" style="stop-color:#722ed1" />
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#logo-grad)" />
        <path d="M30 50 L50 30 L70 50 L50 70 Z" fill="white" />
      </svg>
      <span class="logo-text">AI Agent Laboratory</span>
      <span class="version-tag">BETA v0.4.2</span>
    </div>
    <div class="header-actions">
      <button id="sidebar-toggle" class="btn-ghost" title="Toggle Sidebar">
        <i class="fas fa-sliders-h"></i>
      </button>
      <button onclick="clearHistory()" class="btn-ghost" title="Clear History">
        <i class="fas fa-trash-alt"></i>
      </button>
      <a href="{{ '/' | relative_url }}" class="btn-ghost" title="Back to Blog">
        <i class="fas fa-home"></i>
      </a>
    </div>
  </header>

  <main class="lab-content">
    <!-- 侧边栏遮罩 - 放在 main 内但在 chat-viewport 之前 -->
    <div class="sidebar-overlay"></div>

    <!-- 对话主躯干 -->
    <section class="chat-viewport">
      <div id="lab-chat-messages" class="messages-list">
        <!-- 初始消息 -->
        <div class="msg-wrapper bot appear">
          <div class="msg-bubble">
            <div class="bubble-content">
              欢迎进入 **AI 实验室**。这是一个专为 `by-framework` 深度交互设计的实验环境。
              在这里，你可以探索 Agent 的底层调度能力。
            </div>
            <div class="bubble-meta">System · Just now</div>
          </div>
        </div>
      </div>

      <!-- 悬浮指令输入框：简洁药丸设计 -->
      <div class="command-bar-wrapper">
        <div id="upload-preview-area" class="upload-preview-container"></div>
        <div class="command-bar">
          <div class="input-prefix">
            <i class="fas fa-plus" title="添加附件"></i>
            <i class="fas fa-globe" title="选择模型"></i>
          </div>
          <textarea id="lab-user-input" placeholder="Ask anything..." rows="1"></textarea>
          <!-- 隐藏的文件上传入口 -->
          <input type="file" id="lab-file-input" style="display: none;" accept="image/*">
          <div class="input-suffix">
            <button id="lab-send-btn" class="send-action">
              <i class="fas fa-arrow-up"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 右侧参数面板：精细设计 -->
    <aside class="settings-panel">
      <div class="settings-section">
        <h2 class="section-title"><i class="fas fa-cogs"></i> Engine Config</h2>
        <div class="setting-card">
          <div class="field">
            <label>Discovery Agent</label>
            <div class="custom-select">
              <select id="agent-selector">
                <option value="">Discovering Agents...</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>Session ID</label>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="cfg-session-id" class="styled-input" placeholder="Session ID">
              <button onclick="applyManualSession()" class="btn-primary-sm" style="padding: 0 12px; height: 34px;">
                <i class="fas fa-sync"></i>
              </button>
            </div>
          </div>
          <div class="field">
            <label>Temperature <span>0.7</span></label>
            <input type="range" class="styled-range" min="0" max="100" value="70">
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h2 class="section-title"><i class="fas fa-link"></i> Endpoint Config</h2>
        <div class="setting-card">
          <div class="field">
            <label>Backend API URL</label>
            <input type="text" id="cfg-backend-url" class="styled-input" placeholder="http://localhost:8000">
          </div>
          <div class="field">
            <label>WebSocket URL</label>
            <input type="text" id="cfg-ws-url" class="styled-input" placeholder="ws://localhost:8000/ws/stream">
          </div>
          <button onclick="saveEndpoints()" class="btn-primary-sm" style="width: 100%; margin-top: 4px;">
            <i class="fas fa-sync-alt"></i> Save & Reconnect
          </button>
        </div>
      </div>

      <div class="settings-section">
        <h2 class="section-title"><i class="fas fa-microchip"></i> Framework Status</h2>
        <div id="status-grid" class="status-grid">
          <div class="status-item">
            <span class="label">Gateway</span>
            <span class="value gateway-status">Offline</span>
          </div>
          <div class="status-item">
            <span class="label">Workers</span>
            <span class="value worker-count">0 Active</span>
          </div>
          <div class="status-item">
            <span class="label">Services</span>
            <span class="value service-count">0 Nodes</span>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <h2 class="section-title"><i class="fas fa-history"></i> Recent Sessions</h2>
        <div id="session-list" class="session-list">
          <div class="session-item placeholder">No recent sessions</div>
        </div>
      </div>

    </aside>
  </main>
</div>

<style>
  :root {
    --primary: #1677ff;
    --primary-grad: linear-gradient(135deg, #1677ff 0%, #722ed1 100%);
    --bg-base: #ffffff;
    --bg-glass: rgba(255, 255, 255, 0.92);
    --border-color: rgba(0, 0, 0, 0.04);
    --text-main: #1f1f1f;
    --text-sec: #8c8c8c;
    --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.05);
    --transition-sidebar: 350ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-msg: 400ms ease-out;
    --transition-focus: 200ms ease-out;
    --transition-hover: 150ms ease-out;
    --content-width: 800px; /* 定义统一内容中轴线 */
  }

  [data-mode='dark'] {
    --bg-base: #111112;
    --bg-glass: rgba(17, 17, 18, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-main: #e6e6e6;
    --text-sec: #858585;
    --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
    --primary-grad: linear-gradient(135deg, #1677ff 0%, #722ed1 100%);
  }

  /* 基础结构 */
  * { box-sizing: border-box; } /* 确保所有排版计算一致 */

  .ai-lab-container {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    background: var(--bg-base);
    color: var(--text-main);
    overflow: hidden;
  }

  /* 装饰背景 */
  .lab-bg-ornaments {
    position: fixed;
    inset: 0;
    z-index: 1999;
    pointer-events: none;
    overflow: hidden;
  }

  .mesh-gradient {
    position: absolute;
    top: -30%;
    right: -15%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, rgba(22, 119, 255, 0.06) 0%, rgba(114, 46, 209, 0.03) 50%, transparent 100%);
    filter: blur(100px);
  }

  [data-mode='dark'] .mesh-gradient {
    background: radial-gradient(circle, rgba(6, 182, 212, 0.06) 0%, rgba(139, 92, 246, 0.03) 50%, transparent 100%);
  }

  .dot-grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--border-color) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(circle at 50% 50%, black, transparent 80%);
    opacity: 0.4;
  }

  /* Header */
  .lab-header {
    height: 56px;
    padding: 0 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    background: var(--bg-glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    position: relative;
    z-index: 2002;
  }

  .lab-logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 28px; height: 28px; }
  .logo-text { font-weight: 600; font-size: 14px; letter-spacing: -0.02em; }
  .version-tag { font-size: 10px; background: var(--border-color); padding: 2px 6px; border-radius: 4px; color: var(--text-sec); }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Buttons */
  .btn-ghost {
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--text-main);
    border-radius: 8px;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-hover);
  }
  .btn-ghost:hover {
    background: var(--border-color);
    color: var(--primary);
  }
  .btn-ghost .fas {
    font-size: 16px;
  }

  /* Main Flow */
  .lab-content { flex: 1; display: flex; overflow: hidden; position: relative; }

  .chat-viewport {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    max-width: var(--content-width); 
    margin: 0 auto;
    width: 100%;
  }

  .messages-list {
    flex: 1;
    overflow-y: auto;
    padding: 40px 0 200px;
    display: flex;
    flex-direction: column;
    gap: 32px;
    scrollbar-width: none;
    width: 100%;
  }
  .messages-list::-webkit-scrollbar { display: none; }

  /* Message Style - Clean minimalist */
  .msg-wrapper {
    display: flex;
    transform: translateY(12px);
    opacity: 0;
    transition: var(--transition-msg);
  }
  .msg-wrapper.appear { transform: translateY(0); opacity: 1; }
  .msg-wrapper.user { align-self: flex-end; width: auto; max-width: 85%; }
  .msg-wrapper.bot { align-self: flex-start; width: 100%; }

  /* AI messages - no bubble, just text */
  .bot .msg-bubble {
    width: 100%;
    padding: 0;
    background: transparent;
    border: none;
    box-shadow: none;
  }

  .bot .bubble-content {
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-main);
  }

  .bot .bubble-meta {
    font-size: 11px;
    margin-top: 12px;
    color: var(--text-sec);
  }

  /* User messages - subtle bubble */
  .user .msg-bubble {
    width: 100%;
    padding: 14px 18px;
    border-radius: 18px;
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  [data-mode='dark'] .user .msg-bubble {
    background: rgba(255, 255, 255, 0.08);
  }

  .user .bubble-content {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text-main);
  }

  .user .bubble-meta {
    font-size: 11px;
    margin-top: 8px;
    color: var(--text-sec);
  }

  .command-bar-wrapper {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 0; 
    pointer-events: none;
    width: 100%;
  }

  .command-bar {
    width: 100%;
    max-width: var(--content-width);
    background: #f5f5f5;
    border: 1px solid #e0e0e0;
    border-radius: 16px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    pointer-events: all;
    transition: border-color var(--transition-focus), box-shadow var(--transition-focus);
  }

  [data-mode='dark'] .command-bar {
    background: rgba(255, 255, 255, 0.06);
    border-color: rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }

  .command-bar:focus-within {
    border-color: var(--primary);
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  }

  .input-prefix { color: var(--text-sec); display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .input-prefix i { cursor: pointer; }
  .input-prefix i:hover { color: var(--text-main); }

  #lab-user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-main);
    font-size: 15px;
    max-height: 120px;
    padding: 4px 0;
    line-height: 1.5;
  }

  #lab-user-input::placeholder {
    color: var(--text-sec);
  }

  .input-suffix { display: flex; align-items: center; gap: 8px; }

  .send-action {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--text-sec);
    color: white;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition-hover);
    flex-shrink: 0;
  }
  .send-action:hover {
    background: var(--primary);
    transform: scale(1.05);
  }
  .send-action:active { transform: scale(0.95); }

  [data-mode='dark'] .send-action {
    background: rgba(255, 255, 255, 0.2);
  }
  [data-mode='dark'] .send-action:hover {
    background: var(--primary);
  }

  .command-status { font-size: 11px; color: var(--text-sec); display: flex; align-items: center; gap: 6px; }
  .pulse-dot { width: 6px; height: 6px; background: #52c41a; border-radius: 50%; animation: pulse 2s infinite; }

  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  /* Sidebar */
  .settings-panel {
    position: fixed;
    top: 56px;
    right: 0;
    width: 340px;
    height: calc(100vh - 56px);
    padding: 28px 24px;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-left: 1px solid var(--border-color);
    overflow-y: auto;
    transform: translateX(100%);
    transition: transform var(--transition-sidebar);
    z-index: 2001;
  }

  [data-mode='dark'] .settings-panel {
    background: rgba(17, 17, 18, 0.85);
  }

  .settings-panel.open {
    transform: translateX(0);
  }

  /* 侧边栏展开时的背景遮罩 */
  .sidebar-overlay {
    position: fixed;
    top: 56px;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.1);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-sidebar);
    z-index: 2000;
  }

  .sidebar-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }

  .section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-sec); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  
  .setting-card { background: var(--border-color); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
  
  .field label { display: block; font-size: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .field label span { color: var(--primary); font-weight: bold; }

  .custom-select select {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    padding: 10px;
    border-radius: 8px;
    color: var(--text-main);
    outline: none;
  }

  .styled-input {
    width: 100%;
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--text-main);
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .styled-input:focus { border-color: var(--primary); }

  .btn-primary-sm {
    background: var(--primary);
    color: white;
    border: none;
    padding: 8px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.2s;
  }
  .btn-primary-sm:hover { opacity: 0.9; }

  .status-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .status-item { padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; font-size: 13px; }
  .status-item .alive { color: #52c41a; font-weight: 600; }

  /* Session List Styles */
  .session-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .session-list::-webkit-scrollbar { width: 4px; }
  .session-list::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

  .session-item {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--bg-base);
    border: 1px solid var(--border-color);
    font-size: 12px;
    cursor: pointer;
    transition: all var(--transition-hover);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-sec);
  }
  .session-item:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .session-item.active {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }
  .session-item.placeholder {
    border-style: dashed;
    text-align: center;
    cursor: default;
  }
  .session-item.placeholder:hover { color: var(--text-sec); border-color: var(--border-color); }

  /* 增强 Markdown 渲染样式 */
  .markdown-prose {
    font-size: 15px;
    line-height: 1.7;
    word-break: break-word;
  }
  .markdown-prose p { margin: 0 0 12px; }
  .markdown-prose p:last-child { margin-bottom: 0; }
  .markdown-prose code {
    background: var(--border-color);
    padding: 2px 4px;
    border-radius: 4px;
    font-family: 'Fira Code', monospace;
    font-size: 0.9em;
  }
  .markdown-prose pre {
    background: #1e1e1e;
    color: #d4d4d4;
    padding: 16px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 16px 0;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .markdown-prose pre code {
    background: transparent;
    padding: 0;
    color: inherit;
    font-size: 13px;
  }
  .markdown-prose ul, .markdown-prose ol { padding-left: 20px; margin-bottom: 12px; }
  .markdown-prose blockquote {
    border-left: 4px solid var(--primary);
    margin: 0;
    padding-left: 16px;
    color: var(--text-sec);
    background: var(--border-color);
    padding: 8px 16px;
    border-radius: 0 8px 8px 0;
  }

  /* 推理块样式 (ThinkingBlock) */
  .thinking-block {
    margin-bottom: 16px;
    border-radius: 12px;
    border: 1px solid #e0d9f6;
    background: linear-gradient(135deg, #f8f5ff 0%, #f0f0ff 100%);
    overflow: hidden;
    transition: all 0.3s ease;
  }
  [data-mode='dark'] .thinking-block {
    background: linear-gradient(135deg, #1a1625 0%, #171725 100%);
    border-color: #312e45;
  }

  /* 上传预览样式 */
  .upload-preview-container {
    width: 100%;
    max-width: var(--content-width);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 0 4px;
    margin-bottom: 8px;
  }
  .preview-item {
    position: relative;
    width: 80px;
    height: 80px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--primary);
    box-shadow: var(--shadow-soft);
    animation: previewAppear 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  }
  @keyframes previewAppear {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  .preview-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .preview-item .remove-btn {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 18px;
    height: 18px;
    background: rgba(0,0,0,0.6);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    cursor: pointer;
    border: none;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }
  .preview-item .remove-btn:hover {
    background: #ff4d4f;
  }

  .thinking-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    font-size: 11px;
    font-weight: 700;
    color: #722ed1;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .thinking-header i.fa-chevron-right {
    transition: transform 0.2s;
    font-size: 10px;
    opacity: 0.5;
  }
  .thinking-block.expanded .thinking-header i.fa-chevron-right {
    transform: rotate(90deg);
  }
  .thinking-content {
    display: none;
    padding: 0 12px 12px;
    font-size: 13px;
    color: #594a7a;
    border-top: 1px solid rgba(114, 46, 209, 0.1);
  }
  [data-mode='dark'] .thinking-content { color: #a59cc0; }
  .thinking-block.expanded .thinking-content {
    display: block;
  }

  /* 工具调用样式 (ToolCallBlock) */
  .tool-call-block {
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #fde68a;
    background: #fffef5;
    overflow: hidden;
  }
  [data-mode='dark'] .tool-call-block {

<script>
  let BACKEND_URL = localStorage.getItem('by-lab-backend') || 'http://localhost:8000';
  let WS_URL = localStorage.getItem('by-lab-ws') || 'ws://localhost:8000/ws/stream';
  
  function saveEndpoints() {
    const bUrl = document.getElementById('cfg-backend-url').value.trim();
    const wUrl = document.getElementById('cfg-ws-url').value.trim();
    if (!bUrl || !wUrl) {
      alert('Please enter valid URLs');
      return;
    }
    localStorage.setItem('by-lab-backend', bUrl);
    localStorage.setItem('by-lab-ws', wUrl);
    
    /* 应用并重连 */
    BACKEND_URL = bUrl;
    WS_URL = wUrl;
    
    appendSystemMessage(`Endpoints updated! Reconnecting...`);
    if (socket) socket.close(); /* 触发自动重连逻辑 */
    fetchFrameworkStatus();
    fetchSessions();
  }

  /* 配置 Marked */
  marked.setOptions({
    highlight: function(code, lang) {
      const language = hljs.getLanguage(lang) ? lang : 'plaintext';
      return hljs.highlight(code, { language }).value;
    },
    langPrefix: 'hljs language-',
    breaks: true,
    gfm: true
  });

  let socket = null;
  let lastConnectionState = 'Offline';
  
  /* 优先从存储中恢复 Session ID */
  let currentSessionId = localStorage.getItem('by-lab-session-id') || ('lab-session-' + Date.now());
  localStorage.setItem('by-lab-session-id', currentSessionId);

  let latestMsgId = null;
  let pendingAttachments = []; 
  
  /* 消息内容缓存，用于支持流式 Markdown 全量重绘 */
  const messageContentCache = new Map();

  /* 初始化 WebSocket 连接 */
  function initWebSocket() {
    try {
      socket = new WebSocket(WS_URL);

      socket.onopen = () => {
        console.log('Connected to by-framework-web gateway');
        updateGatewayStatus('Online');
        if (lastConnectionState !== 'Online') {
          appendSystemMessage(`Successfully connected to Gateway: ${WS_URL}`);
          lastConnectionState = 'Online';
        }
        socket.send(jsonStr({ action: 'set_session', session_id: currentSessionId }));
      };

      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          handleIncomingMessage(data);
        } catch (e) {
          console.error('Failed to parse WS message', e);
        }
      };

      socket.onclose = () => {
        console.warn('WS disconnected. Retrying in 3s...');
        updateGatewayStatus('Offline');
        if (lastConnectionState === 'Online') {
          appendSystemError(`Connection lost to Gateway. Retrying...`);
          lastConnectionState = 'Offline';
        }
        setTimeout(initWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error('WS Error:', err);
        updateGatewayStatus('Error');
        if (lastConnectionState === 'Online') {
          appendSystemError(`Gateway connection error occurred.`);
          lastConnectionState = 'Error';
        }
      };
    } catch (e) {
      console.error('Failed to create WebSocket', e);
      updateGatewayStatus('Failed');
    }
  }

  function jsonStr(obj) { return JSON.stringify(obj); }

  function updateGatewayStatus(status) {
    const statusVal = document.querySelector('.gateway-status');
    if (statusVal) {
      statusVal.textContent = status;
      statusVal.style.color = status === 'Online' ? '#52c41a' : '#ff4d4f';
    }
  }

  /* 轮询后端获取 Worker 和 Service 状态 */
  async function fetchFrameworkStatus() {
    try {
      const workerResp = await fetch(`${BACKEND_URL}/api/workers`);
      const workerData = await workerResp.json();
      const workers = workerData.workers || {};
      const workerArray = Object.values(workers);
      const activeCount = workerArray.filter(w => w.status === 'alive').length;
      document.querySelector('.worker-count').textContent = `${activeCount} Active`;

      updateAgentSelector(workerArray);

      const serviceResp = await fetch(`${BACKEND_URL}/api/services`);
      const serviceData = await serviceResp.json();
      const services = serviceData.services || [];
      const totalInstances = services.reduce((acc, s) => acc + (s.instance_count || 0), 0);
      document.querySelector('.service-count').textContent = `${totalInstances} Nodes`;
    } catch (err) {
      console.warn('Failed to fetch framework status', err);
    }
  }

  function updateAgentSelector(workers) {
    const selector = document.getElementById('agent-selector');
    if (!selector) return;

    const currentValue = selector.value;
    
    let agentTypes = [];
    workers.forEach(w => {
      if (w.status !== 'alive') return;
      if (Array.isArray(w.agent_types)) {
        agentTypes.push(...w.agent_types);
      } else if (w.agent_type) {
        agentTypes.push(w.agent_type);
      } else if (w.name || w.worker_id) {
        agentTypes.push(w.name || w.worker_id);
      }
    });

    agentTypes = [...new Set(agentTypes)].filter(Boolean);

    if (agentTypes.length === 0) {
      selector.innerHTML = '<option value="">No Active Agents</option>';
      return;
    }

    selector.innerHTML = agentTypes.map(type => `
      <option value="${type}" ${type === currentValue ? 'selected' : ''}>${type}</option>
    `).join('');
    
    if (!agentTypes.includes(currentValue) && agentTypes.length > 0) {
      selector.value = agentTypes[0];
    }
  }

  /* 获取会话历史列表 */
  async function fetchSessions() {
    try {
      const response = await fetch(`${BACKEND_URL}/api/sessions`);
      const data = await response.json();
      const sessions = data.sessions || [];
      const listContainer = document.getElementById('session-list');
      
      if (sessions.length === 0) {
        listContainer.innerHTML = '<div class="session-item placeholder">No recent sessions</div>';
        return;
      }

      listContainer.innerHTML = sessions.slice(0, 8).map(sid => `
        <div class="session-item ${sid === currentSessionId ? 'active' : ''}" onclick="switchSession('${sid}')">
          ${sid}
        </div>
      `).join('');
    } catch (err) {
      console.error('Failed to fetch sessions', err);
    }
  }

  /* 切换会话并拉取历史 */
  async function switchSession(sid) {
    if (sid === currentSessionId) return;
    if (!confirm('Switch to this session and load history? Current view will be cleared.')) return;

    forceSwitchSession(sid);
  }

  async function applyManualSession() {
    const input = document.getElementById('cfg-session-id');
    const newSid = input.value.trim();
    if (!newSid) {
      alert('Please enter a valid session ID');
      return;
    }
    if (newSid === currentSessionId) return;
    
    forceSwitchSession(newSid);
  }

  async function forceSwitchSession(sid) {
    currentSessionId = sid;
    localStorage.setItem('by-lab-session-id', sid);
    
    /* 同步输入框内容 */
    const input = document.getElementById('cfg-session-id');
    if (input) input.value = sid;

    messageContentCache.clear();
    document.getElementById('lab-chat-messages').innerHTML = '';
    
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(jsonStr({ action: 'set_session', session_id: currentSessionId }));
    }
    
    await fetchSessionHistory(sid);
    fetchSessions();
  }

  async function fetchSessionHistory(sid) {
    try {
      const response = await fetch(`${BACKEND_URL}/api/sessions/${sid}/history`);
      const data = await response.json();
      const history = data.history || [];
      
      history.forEach(msg => {
        if (msg.role === 'user') {
          appendUserMessage(msg.content);
        } else {
          /* 历史消息的处理逻辑 */
          const msgId = msg.id || ('hist-' + Math.random());
          const content = typeof msg.content === 'object' ? msg.content.text : msg.content;
          updateMessageContent(msgId, content, 'bot');
        }
      });
    } catch (err) {
      console.error('Failed to fetch history', err);
    }
  }

  /* ── 核心解析逻辑 ─────────────────────────────────────────────────── */

  function parseThinkTags(raw) {
    if (!raw || !raw.includes('<think>')) return { thinking: '', body: raw };
    
    let thinking = '';
    let body = '';
    let cursor = 0;

    while (cursor < raw.length) {
      const openIdx = raw.indexOf('<think>', cursor);
      if (openIdx === -1) {
        body += raw.slice(cursor);
        break;
      }

      body += raw.slice(cursor, openIdx);
      const closeIdx = raw.indexOf('</think>', openIdx + 7);
      
      if (closeIdx === -1) {
        thinking += (thinking ? '\n' : '') + raw.slice(openIdx + 7).trim();
        break;
      }

      thinking += (thinking ? '\n' : '') + raw.slice(openIdx + 7, closeIdx).trim();
      cursor = closeIdx + 8;
    }
    return { thinking: thinking.trim(), body: body.trim() };
  }

  function handleIncomingMessage(data) {
    const messagesContainer = document.getElementById('lab-chat-messages');
    if (data.type === 'ping') return;
    if (data.session_id && data.session_id !== currentSessionId) return;

    /* 关键修正：优先使用 message_id 进行分组，而不是过于细碎的 id (event id) */
    /* 这样同一 Agent 的推理 (reasoning) 和 回答 (answer) 就能在同一个缓存 key 下拼接 */
    const agentType = data.source_agent_type || 'assistant';
    const msgId = (data.message_id || data.id || 'stream-msg') + '-' + agentType;
    
    /* 综合解析 content (处理 choices.delta, chunk, 或全量 content) */
    let chunkContent = "";
    const choices = data.choices || (data.data && data.data.choices);
    
    if (choices && choices[0] && choices[0].delta) {
      chunkContent = choices[0].delta.content || "";
      /* 处理工具调用 (Tool Calls) */
      if (choices[0].delta.tool_calls) {
        renderToolCalls(msgId, choices[0].delta.tool_calls);
      }
      if (choices[0].delta.tool_responses) {
        renderToolResponses(msgId, choices[0].delta.tool_responses);
      }
    } else if (data.data && data.data.chunk) {
      chunkContent = data.data.chunk;
    } else {
      chunkContent = data.chunk || data.content || "";
    }

    if (chunkContent || data.id) {
      updateMessageContent(msgId, chunkContent, 'bot');
    }

    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }

  function updateMessageContent(id, chunk, role) {
    const messagesContainer = document.getElementById('lab-chat-messages');
    let msgWrapper = document.getElementById(`msg-${id}`);
    
    /* 获取或创建缓存 */
    let fullContent = messageContentCache.get(id) || "";
    fullContent += chunk;
    messageContentCache.set(id, fullContent);

    if (!msgWrapper) {
      msgWrapper = document.createElement('div');
      msgWrapper.id = `msg-${id}`;
      msgWrapper.className = `msg-wrapper ${role}`;
      msgWrapper.innerHTML = `
        <div class="msg-bubble">
          <div class="bubble-content-area"></div>
          <div class="bubble-meta">${role === 'user' ? 'You' : 'Agent'} · Just now</div>
        </div>
      `;
      messagesContainer.appendChild(msgWrapper);
      setTimeout(() => msgWrapper.classList.add('appear'), 10);
    }

    const contentArea = msgWrapper.querySelector('.bubble-content-area');
    
    /* 如果是用户消息，直接显示文本（或简单 Markdown） */
    if (role === 'user') {
      contentArea.innerHTML = `<div class="markdown-prose">${marked.parse(fullContent)}</div>`;
      return;
    }

    /* Agent 消息：解析推理标签 */
    const parsed = parseThinkTags(fullContent);
    contentArea.innerHTML = ''; /* 清空重新渲染 */

    /* 1. 渲染推理块 */
    if (parsed.thinking) {
      contentArea.appendChild(getOrCreateThinkingBlock(id, parsed.thinking));
    }

    /* 2. 渲染正文 */
    if (parsed.body) {
      const bodyEl = document.createElement('div');
      bodyEl.className = 'markdown-prose';
      bodyEl.innerHTML = DOMPurify.sanitize(marked.parse(parsed.body));
      contentArea.appendChild(bodyEl);
    } else if (!parsed.thinking) {
       /* 防止空消息 */
       contentArea.innerHTML = '<div class="pulse-dot"></div>';
    }
    
    /* 处理代码高亮 */
    contentArea.querySelectorAll('pre code').forEach((el) => {
      hljs.highlightElement(el);
    });
  }

  function getOrCreateThinkingBlock(msgId, content) {
    const blockId = `think-${msgId}`;
    let block = document.getElementById(blockId);
    if (!block) {
      block = document.createElement('div');
      block.id = blockId;
      block.className = 'thinking-block expanded';
      block.innerHTML = `
        <div class="thinking-header" onclick="this.parentElement.classList.toggle('expanded')">
          <i class="fas fa-brain"></i>
          <span>思考过程</span>
          <i class="fas fa-chevron-right ml-auto"></i>
        </div>
        <div class="thinking-content"></div>
      `;
    }
    const contentEl = block.querySelector('.thinking-content');
    contentEl.innerHTML = DOMPurify.sanitize(marked.parse(content));
    return block;
  }


  function renderToolCalls(msgId, toolCalls) {
    const msgWrapper = document.getElementById(`msg-${msgId}`);
    if (!msgWrapper) return;
    
    const bubble = msgWrapper.querySelector('.msg-bubble');
    let toolContainer = msgWrapper.querySelector('.tool-calls-container');
    
    if (!toolContainer) {
      toolContainer = document.createElement('div');
      toolContainer.className = 'tool-calls-container';
      bubble.insertBefore(toolContainer, bubble.firstChild);
    }

    toolCalls.forEach(tc => {
      /* 1. 优先使用 Tool Call 自身的 ID 进行全局查重 (适合流式中 ID 保持不变的情况) */
      /* 2. 如果没有 ID，则使用 msgId + index 组合 (适合 OpenAI 这种只有第一帧有 ID 的情况) */
      const tcIdx = tc.index !== undefined ? tc.index : 0;
      const tcId = tc.id ? `tc-${tc.id}` : `tc-msg-${msgId}-${tcIdx}`;
      
      let tcEl = document.getElementById(tcId);
      if (!tcEl) {
        /* 全局搜索一下，防止跨消息的 ID 重复（部分 Backend 实现可能在不同事件中传同一个 ID） */
        /* 如果是全新创建 */
        tcEl = document.createElement('div');
        tcEl.id = tcId;
        tcEl.className = 'tool-call-block';
        tcEl.innerHTML = `
          <div class="tool-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <i class="fas fa-wrench"></i>
            <span class="tool-name">Initializing...</span>
            <i class="fas fa-chevron-down chevron"></i>
          </div>
          <div class="tool-args"></div>
        `;
        toolContainer.appendChild(tcEl);
      }
      
      if (tc.function) {
        const nameEl = tcEl.querySelector('.tool-name');
        const argsEl = tcEl.querySelector('.tool-args');
        
        if (tc.function.name) {
          nameEl.textContent = tc.function.name;
        }
        
        /* 处理参数：如果是全新的 arguments 则直接赋值，如果是 delta 则追加 */
        /* 部分后端在后续 chunk 中传的是全量，部分是增量。 */
        /* 这里做一个简单的去重：如果当前的内容已经包含了这次传过来的内容，则不追加 */
        if (tc.function.arguments) {
          const currentArgs = argsEl.textContent;
          const newArgs = tc.function.arguments;
          
          /* 如果后端传的是全量数据且已经展示过，则跳过 (简单判断) */
          if (currentArgs === newArgs) return;
          
          /* 否则认为是增量补全 */
          argsEl.textContent += newArgs;
        }
      }
    });
  }
  function renderToolResponses(msgId, toolResponses) {
    if (!toolResponses) return;
    
    toolResponses.forEach(res => {
      /* 优先根据 tool_call_id 全局查找 */
      const tcId = `tc-${res.tool_call_id}`;
      let tcEl = document.getElementById(tcId);
      
      /* 如果找不到具体的 ID 块，尝试查找该消息下的最后一个工具块 */
      if (!tcEl) {
        const msgWrapper = document.getElementById(`msg-${msgId}`);
        if (msgWrapper) {
          const blocks = msgWrapper.querySelectorAll('.tool-call-block');
          tcEl = blocks[blocks.length - 1]; /* 回退：假设是最近的一个 */
        }
      }

      if (!tcEl) return;

      let resContainer = tcEl.querySelector('.tool-result');
      if (!resContainer) {
        resContainer = document.createElement('div');
        resContainer.className = 'tool-result';
        resContainer.innerHTML = `
          <div class="tool-result-header">
            <i class="fas fa-check-circle"></i> Result
          </div>
          <div class="tool-result-content"></div>
        `;
        tcEl.appendChild(resContainer);
        
        /* 视觉反馈：执行成功后将头部变绿 */
        const header = tcEl.querySelector('.tool-header');
        header.style.color = '#16a34a';
        tcEl.style.borderColor = '#bbf7d0';
      }

      if (res.content) {
        const contentEl = resContainer.querySelector('.tool-result-content');
        /* 如果是全量内容且已展示则跳过，否则认为是增量补充（虽然 response 通常是一次性的） */
        if (contentEl.textContent === res.content) return;
        contentEl.textContent = res.content; /* Response 通常不采用增量，直接覆盖或设置即可 */
      }
    });
  }

  /* 触发文件上传 */
  async function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    /* 显示上传中状态 */
    const plusBtn = document.querySelector('.fa-plus');
    const originalClassName = plusBtn.className;
    plusBtn.className = 'fas fa-spinner fa-spin';

    const formData = new FormData();
    formData.append('file', file);
    formData.append('session_id', currentSessionId);

    try {
      const response = await fetch(`${BACKEND_URL}/api/uploads/images`, {
        method: 'POST',
        body: formData
      });
      const result = await response.json();
      if (result.success) {
        /* 使用返回的数据：result.file.fileUrl 等 */
        pendingAttachments.push(result.file);
        renderUploadPreview(result.file);
      } else {
        appendSystemError(`Upload failed: ${result.error}`);
      }
    } catch (err) {
      appendSystemError(`Upload error: ${err.message}`);
    } finally {
      plusBtn.className = originalClassName;
      event.target.value = ''; /* 重置 */
    }
  }

  function renderUploadPreview(fileData) {
    const previewArea = document.getElementById('upload-preview-area');
    const item = document.createElement('div');
    item.className = 'preview-item';
    item.dataset.fileId = fileData.fileId;

    /* 构建完整的绝对 URL */
    let displayUrl = fileData.fileUrl;
    if (!displayUrl.includes('://')) {
        const base = BACKEND_URL.includes('://') ? BACKEND_URL : 'http://' + BACKEND_URL;
        displayUrl = new URL(displayUrl, base).href;
    }

    /* 使用 DOM API 而非 innerHTML 模板字符串，避免浏览器对 URL 的自动规范化 */
    const img = document.createElement('img');
    img.src = displayUrl;
    img.alt = fileData.fileName;
    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
    removeBtn.onclick = () => removeAttachment(fileData.fileId);
    item.appendChild(img);
    item.appendChild(removeBtn);
    previewArea.appendChild(item);
  }

  function removeAttachment(fileId) {
    /* 从数组中移除 */
    pendingAttachments = pendingAttachments.filter(a => String(a.fileId) !== String(fileId));
    /* 从 UI 中移除 */
    const item = document.querySelector(`.preview-item[data-file-id="${fileId}"]`);
    if (item) item.remove();
  }

  async function handleSend() {
    const userInput = document.getElementById('lab-user-input');
    const text = userInput.value.trim();
    if (!text && pendingAttachments.length === 0) return;

    /* 1. UI 展示消息 */
    appendUserMessage(text || "[Sent an attachment]");
    userInput.value = '';
    userInput.style.height = 'auto';

    /* 2. 构造 Payload */
    const targetAgent = document.getElementById('agent-selector').value;
    const temperature = document.querySelector('.styled-range').value / 100;

    /* 如果有附件，构造多模态内容或者在 metadata 中携带 */
    let content = text;
    if (pendingAttachments.length > 0) {
      /* 这里的协议需要与 by-framework 后端对齐 */
      content = [
        { type: "text", text: text || "Analyze this image" },
        ...pendingAttachments.map(attr => {
            let path = attr.fileUrl || attr.url || attr.path;
            let finalUrl = path;
            try {
                /* 如果已经是绝对 URL，直接使用；否则拼接 base */
                if (path && path.includes('://')) {
                    finalUrl = path;
                } else {
                    let base = BACKEND_URL;
                    if (base && !base.includes('://')) base = 'http://' + base;
                    finalUrl = new URL(path, base).href;
                }
            } catch (e) {
                console.error("URL construct error in send:", e);
            }
            return {
                type: "image_url",
                image_url: { url: finalUrl }
            };
        })
      ];
    }

    const payload = {
      content: content,
      session_id: currentSessionId,
      target_agent_type: targetAgent,
      user_code: 'lab-user',
      user_name: 'Lab Guest',
      metadata: { temperature: temperature }
    };

    /* 清空待发送附件与预览 */
    pendingAttachments = [];
    document.getElementById('upload-preview-area').innerHTML = '';

    try {
      const response = await fetch(`${BACKEND_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: jsonStr(payload)
      });
      const result = await response.json();
      if (!result.success) {
        appendSystemError(`Failed: ${result.error}`);
      }
    } catch (err) {
      appendSystemError(`Connection error: ${err.message}`);
    }
  }

  function appendUserMessage(text) {
    const msgId = 'user-' + Date.now();
    updateMessageContent(msgId, text, 'user');
  }

  function appendSystemMessage(text) {
    const messages = document.getElementById('lab-chat-messages');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper bot appear`;
    wrapper.innerHTML = `
      <div class="msg-bubble" style="background: rgba(82, 196, 26, 0.05); border-color: rgba(82, 196, 26, 0.2); border-left: 3px solid #52c41a;">
        <div class="bubble-content-area" style="font-size: 13px; color: #52c41a; font-weight: 500;">
          <i class="fas fa-check-circle mr-1"></i> ${text}
        </div>
      </div>
    `;
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
  }

  function appendSystemError(errText) {
    const messages = document.getElementById('lab-chat-messages');
    const wrapper = document.createElement('div');
    wrapper.className = `msg-wrapper bot appear`;
    wrapper.innerHTML = `
      <div class="msg-bubble" style="background: rgba(255, 77, 79, 0.05); border-color: rgba(255, 77, 79, 0.2); border-left: 3px solid #ff4d4f;">
        <div class="bubble-content-area" style="font-size: 13px; color: #ff4d4f; font-weight: 500;">
          <i class="fas fa-exclamation-circle mr-1"></i> ${errText}
        </div>
      </div>
    `;
    messages.appendChild(wrapper);
    messages.scrollTop = messages.scrollHeight;
  }

  /* 页面加载逻辑 */
  document.addEventListener('DOMContentLoaded', () => {
    initWebSocket();
    
    /* 启动状态轮询 */
    fetchFrameworkStatus();
    fetchSessions();
    setInterval(fetchFrameworkStatus, 10000); 
    setInterval(fetchSessions, 30000); 

    /* 初始化配置表单值 */
    document.getElementById('cfg-backend-url').value = BACKEND_URL;
    document.getElementById('cfg-ws-url').value = WS_URL;
    document.getElementById('cfg-session-id').value = currentSessionId;

    const userInput = document.getElementById('lab-user-input');
    const sendBtn = document.getElementById('lab-send-btn');
    const fileInput = document.getElementById('lab-file-input');
    const plusBtn = document.querySelector('.fa-plus');

    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keydown', (e) => {
      /* 修复中文输入法下回车选词会触发发送的问题 */
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        handleSend();
      }
    });

    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    /* 附件上传逻辑 */
    if (plusBtn) {
      plusBtn.addEventListener('click', () => fileInput.click());
    }
    if (fileInput) {
      fileInput.addEventListener('change', handleFileUpload);
    }

    /* 侧边栏交互逻辑保持 */
    initSidebar();
  });

  function initSidebar() {
    let sidebarOpen = false;
    const sidebar = document.querySelector('.settings-panel');
    const overlay = document.querySelector('.sidebar-overlay');
    const sidebarToggle = document.getElementById('sidebar-toggle');

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      if (sidebarOpen) {
        sidebar.classList.add('open');
        overlay.classList.add('visible');
        sidebarToggle.querySelector('i').className = 'fas fa-times';
      } else {
        sidebar.classList.remove('open');
        overlay.classList.remove('visible');
        sidebarToggle.querySelector('i').className = 'fas fa-sliders-h';
      }
    }

    if (sidebarToggle) sidebarToggle.addEventListener('click', toggleSidebar);
    if (overlay) overlay.addEventListener('click', toggleSidebar);
  }

  function clearHistory() {
    if (confirm('确定要清除所有对话记录吗？')) {
      document.getElementById('lab-chat-messages').innerHTML = '';
      currentSessionId = 'lab-session-' + Date.now();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(jsonStr({ action: 'set_session', session_id: currentSessionId }));
      }
    }
  }
</script>
