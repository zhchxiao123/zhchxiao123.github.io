<!-- 
  Custom Footer for Chirpy Theme
  包含右下角音乐播放器（可隐藏版本）
-->
<footer id="footer" class="footer">

  <!-- 音乐播放器 -->
  <link rel="stylesheet" href="{{ '/assets/css/music-player.css' | relative_url }}">
  
  <!-- 隐藏的音频元素 -->
  <audio id="bgm-audio" preload="none">
    <source src="{{ '/assets/audio/xi-xing-le.mp3' | relative_url }}" type="audio/mpeg">
  </audio>

  <!-- 播放器 UI -->
  <div class="music-player-float" id="music-player">
    <!-- 关闭按钮 - 最小化播放器 -->
    <button class="music-player-close" onclick="minimizePlayer()" title="隐藏播放器">✕</button>
    
    <div class="music-player-header">
      <div class="music-player-cover">🎵</div>
      <div class="music-player-info">
        <p class="music-player-title">《西行乐》</p>
        <p class="music-player-artist">取经路上BGM · 降妖也动感</p>
      </div>
    </div>
    
    <div class="music-player-controls">
      <button class="music-player-btn" id="play-btn" onclick="toggleMusic()" title="播放/暂停">
        <span id="play-icon">▶</span>
      </button>
      
      <div class="music-player-progress">
        <div class="music-player-time">
          <span id="current-time">0:00</span>
          <span id="duration">2:43</span>
        </div>
        <div class="music-player-bar" onclick="seekMusic(event)">
          <div class="music-player-bar-fill" id="progress-fill"></div>
        </div>
      </div>
      
      <div class="music-player-volume">
        🔊 <input type="range" min="0" max="100" value="80" onchange="setVolume(this.value)">
      </div>
    </div>
  </div>

  <!-- 最小化后的悬浮按钮 -->
  <div class="music-player-minimized" id="mini-player" onclick="restorePlayer()" title="显示播放器">
  </div>

  <!-- 播放器控制脚本 -->
  <script>
    const audio = document.getElementById('bgm-audio');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const progressFill = document.getElementById('progress-fill');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const musicPlayer = document.getElementById('music-player');
    const miniPlayer = document.getElementById('mini-player');
    
    let isPlaying = false;
    
    // 播放/暂停切换
    function toggleMusic() {
      if (isPlaying) {
        audio.pause();
        playIcon.textContent = '▶';
        isPlaying = false;
        miniPlayer.classList.remove('playing');
      } else {
        audio.play();
        playIcon.textContent = '⏸';
        isPlaying = true;
        miniPlayer.classList.add('playing');
      }
    }
    
    // 更新进度条
    audio.addEventListener('timeupdate', function() {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = percent + '%';
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });
    
    // 音频加载完成后显示时长
    audio.addEventListener('loadedmetadata', function() {
      durationEl.textContent = formatTime(audio.duration);
    });
    
    // 播放结束
    audio.addEventListener('ended', function() {
      playIcon.textContent = '▶';
      isPlaying = false;
      progressFill.style.width = '0%';
      miniPlayer.classList.remove('playing');
    });
    
    // 点击进度条跳转
    function seekMusic(event) {
      const bar = event.currentTarget;
      const percent = event.offsetX / bar.offsetWidth;
      audio.currentTime = percent * audio.duration;
    }
    
    // 设置音量
    function setVolume(value) {
      audio.volume = value / 100;
    }
    
    // 格式化时间
    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return mins + ':' + (secs < 10 ? '0' : '') + secs;
    }
    
    // 初始化音量
    audio.volume = 0.8;
    
    // ===== 隐藏/恢复播放器 =====
    
    // 最小化播放器
    function minimizePlayer() {
      musicPlayer.classList.add('hidden');
      miniPlayer.classList.add('show');
      
      // 保存状态到 localStorage
      localStorage.setItem('musicPlayerMinimized', 'true');
    }
    
    // 恢复播放器
    function restorePlayer() {
      musicPlayer.classList.remove('hidden');
      miniPlayer.classList.remove('show');
      
      // 保存状态到 localStorage
      localStorage.setItem('musicPlayerMinimized', 'false');
    }
    
    // 页面加载时恢复状态
    document.addEventListener('DOMContentLoaded', function() {
      const isMinimized = localStorage.getItem('musicPlayerMinimized');
      if (isMinimized === 'true') {
        minimizePlayer();
      }
    });
  </script>

</footer>
