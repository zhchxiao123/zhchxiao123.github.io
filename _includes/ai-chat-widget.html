<!-- AI Chat Widget for blog posts -->
{% if page.layout == 'post' or layout.layout == 'post' %}
<style>
  #ai-chat-widget-root {
    /* Hypothesis client uses 2147483646/2147483647; keep AI elements on top */
    --ai-chat-z-sidebar: 2147483647;
    --ai-chat-z-toggle: 2147483647;
    --ai-chat-z-float-btn: 2147483647;
    --ai-chat-sidebar-width: 380px;
    --ai-chat-sidebar-max-width: calc(100vw - 2rem);
    --ai-chat-primary: var(--link-color, #0056b2);
    --ai-chat-bg: var(--card-bg, #ffffff);
    --ai-chat-text: var(--text-color, #34343c);
    --ai-chat-muted: var(--text-muted-color, #757575);
    --ai-chat-border: var(--main-border-color, #f3f3f3);
    --ai-chat-hover-bg: var(--sidebar-hover-bg, rgb(223 233 241 / 64%));
    --ai-chat-shadow: var(--card-shadow, rgb(104 104 104 / 5%) 0 2px 6px 0, rgb(211 209 209 / 15%) 0 0 0 1px);
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: var(--ai-chat-z-sidebar);
  }

  #ai-chat-widget-root *,
  #ai-chat-widget-root *::before,
  #ai-chat-widget-root *::after {
    box-sizing: border-box;
  }

  /* Toggle button */
  #ai-chat-toggle {
    position: fixed;
    bottom: 5.5rem;
    right: 1.5rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid var(--ai-chat-border);
    background: var(--ai-chat-bg);
    color: var(--ai-chat-primary);
    box-shadow: var(--ai-chat-shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    z-index: var(--ai-chat-z-toggle);
  }

  #ai-chat-toggle:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 14px rgb(0 0 0 / 12%);
  }

  #ai-chat-toggle i {
    font-size: 1.25rem;
  }

  #ai-chat-toggle .ai-chat-close-icon {
    display: none;
  }

  #ai-chat-toggle.open .ai-chat-open-icon {
    display: none;
  }

  #ai-chat-toggle.open .ai-chat-close-icon {
    display: block;
  }

  /* Sidebar */
  #ai-chat-sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: var(--ai-chat-sidebar-width);
    max-width: var(--ai-chat-sidebar-max-width);
    height: 100vh;
    background: var(--ai-chat-bg);
    border-left: 1px solid var(--ai-chat-border);
    box-shadow: -4px 0 24px rgb(0 0 0 / 10%);
    display: flex;
    flex-direction: column;
    pointer-events: auto;
    transform: translateX(110%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: var(--ai-chat-z-sidebar);
  }

  #ai-chat-sidebar.open {
    transform: translateX(0);
  }

  /* Header */
  #ai-chat-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--ai-chat-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #ai-chat-header-title {
    font-weight: 600;
    color: var(--ai-chat-text);
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  #ai-chat-header-title i {
    color: var(--ai-chat-primary);
  }

  #ai-chat-header-close {
    background: transparent;
    border: none;
    color: var(--ai-chat-muted);
    cursor: pointer;
    padding: 0.25rem;
    font-size: 1.1rem;
    line-height: 1;
  }

  #ai-chat-header-close:hover {
    color: var(--ai-chat-text);
  }

  /* Messages area */
  #ai-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    scroll-behavior: smooth;
  }

  .ai-chat-message {
    display: flex;
    flex-direction: column;
    max-width: 92%;
    animation: ai-chat-fade-in 0.25s ease;
  }

  .ai-chat-message.user {
    align-self: flex-end;
  }

  .ai-chat-message.assistant {
    align-self: flex-start;
  }

  .ai-chat-bubble {
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    font-size: 0.95rem;
    line-height: 1.6;
    word-break: break-word;
  }

  .ai-chat-message.user .ai-chat-bubble {
    background: var(--ai-chat-primary);
    color: #fff;
    border-bottom-right-radius: 0.25rem;
  }

  .ai-chat-message.assistant .ai-chat-bubble {
    background: var(--ai-chat-hover-bg);
    color: var(--ai-chat-text);
    border-bottom-left-radius: 0.25rem;
    border: 1px solid var(--ai-chat-border);
  }

  .ai-chat-message.assistant .ai-chat-bubble.ai-chat-error {
    background: var(--prompt-danger-bg, rgb(248 215 218 / 56%));
    border-color: var(--prompt-danger-icon-color, #df3c30);
  }

  .ai-chat-meta {
    font-size: 0.75rem;
    color: var(--ai-chat-muted);
    margin-top: 0.25rem;
    padding: 0 0.4rem;
  }

  .ai-chat-message.user .ai-chat-meta {
    align-self: flex-end;
  }

  /* Markdown inside assistant bubble */
  .ai-chat-bubble p {
    margin: 0 0 0.6rem;
  }

  .ai-chat-bubble p:last-child {
    margin-bottom: 0;
  }

  .ai-chat-bubble ul,
  .ai-chat-bubble ol {
    margin: 0.4rem 0;
    padding-left: 1.25rem;
  }

  .ai-chat-bubble li {
    margin: 0.15rem 0;
  }

  .ai-chat-bubble code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: var(--inline-code-bg, rgb(25 25 28 / 5%));
    color: var(--code-color, #3a3a3a);
    padding: 0.15rem 0.35rem;
    border-radius: 4px;
    font-size: 0.88em;
  }

  .ai-chat-bubble pre {
    background: var(--highlight-bg-color, #f6f8fa);
    border: 1px solid var(--ai-chat-border);
    border-radius: 6px;
    padding: 0.75rem;
    overflow-x: auto;
    margin: 0.5rem 0;
  }

  .ai-chat-bubble pre code {
    background: transparent;
    padding: 0;
    color: inherit;
    font-size: 0.85em;
  }

  .ai-chat-bubble a {
    color: var(--ai-chat-primary);
    text-decoration: underline;
  }

  .ai-chat-bubble strong {
    font-weight: 600;
  }

  .ai-chat-bubble em {
    font-style: italic;
  }

  /* Input area */
  #ai-chat-input-area {
    padding: 1rem 1.25rem 1.25rem;
    border-top: 1px solid var(--ai-chat-border);
    flex-shrink: 0;
  }

  #ai-chat-context-hint {
    font-size: 0.78rem;
    color: var(--ai-chat-muted);
    margin-bottom: 0.5rem;
    line-height: 1.4;
    display: none;
  }

  #ai-chat-context-hint.visible {
    display: block;
  }

  #ai-chat-input-wrap {
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
    border: 1px solid var(--ai-chat-border);
    border-radius: 1rem;
    padding: 0.5rem 0.75rem;
    background: var(--ai-chat-bg);
  }

  #ai-chat-input-wrap:focus-within {
    border-color: var(--ai-chat-primary);
  }

  #ai-chat-input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--ai-chat-text);
    font-size: 0.95rem;
    line-height: 1.5;
    max-height: 120px;
    min-height: 24px;
    resize: none;
    outline: none;
    font-family: inherit;
  }

  #ai-chat-input::placeholder {
    color: var(--ai-chat-muted);
  }

  #ai-chat-send {
    background: transparent;
    border: none;
    color: var(--ai-chat-primary);
    cursor: pointer;
    padding: 0.25rem;
    font-size: 1.1rem;
    line-height: 1;
    transition: opacity 0.2s ease;
  }

  #ai-chat-send:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #ai-chat-send:not(:disabled):hover {
    opacity: 0.8;
  }

  /* Floating ask button */
  #ai-chat-float-btn {
    position: fixed;
    display: none;
    align-items: center;
    gap: 0.35rem;
    padding: 0.5rem 0.85rem;
    background: var(--ai-chat-primary);
    color: #fff;
    border: none;
    border-radius: 2rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 14px rgb(0 0 0 / 18%);
    pointer-events: auto;
    z-index: var(--ai-chat-z-float-btn);
    white-space: nowrap;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  #ai-chat-float-btn:hover {
    transform: translateY(-1px);
  }

  #ai-chat-float-btn i {
    font-size: 0.8rem;
  }

  /* Empty state */
  #ai-chat-empty {
    text-align: center;
    color: var(--ai-chat-muted);
    padding: 2rem 0;
    font-size: 0.9rem;
  }

  /* Loading dots */
  .ai-chat-loading {
    display: inline-flex;
    gap: 0.25rem;
    align-items: center;
    padding: 0.5rem 0;
  }

  .ai-chat-loading span {
    width: 6px;
    height: 6px;
    background: var(--ai-chat-muted);
    border-radius: 50%;
    animation: ai-chat-bounce 1.4s infinite ease-in-out both;
  }

  .ai-chat-loading span:nth-child(1) { animation-delay: -0.32s; }
  .ai-chat-loading span:nth-child(2) { animation-delay: -0.16s; }

  /* Mobile bottom sheet */
  @media (max-width: 768px) {
    #ai-chat-sidebar {
      width: 100vw;
      max-width: 100vw;
      top: auto;
      bottom: 0;
      height: 90vh;
      max-height: none;
      border-radius: 1rem 1rem 0 0;
      border-left: none;
      transform: translateY(110%);
      box-shadow: 0 -4px 24px rgb(0 0 0 / 12%);
    }

    #ai-chat-sidebar.open {
      transform: translateY(0);
    }

    #ai-chat-toggle {
      bottom: 5rem;
      right: 1rem;
      width: 44px;
      height: 44px;
    }

    #ai-chat-float-btn {
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
    }

    #ai-chat-header {
      padding: 0.875rem 1rem;
    }

    #ai-chat-messages {
      padding: 0.875rem 1rem;
    }

    #ai-chat-input-area {
      padding: 0.875rem 1rem 1rem;
    }
  }

  @keyframes ai-chat-fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes ai-chat-bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }
</style>

<div id="ai-chat-widget-root" aria-label="AI Chat">
  <button id="ai-chat-toggle" aria-label="打开 AI 问答" title="AI 问答">
    <i class="fas fa-comment-dots ai-chat-open-icon"></i>
    <i class="fas fa-times ai-chat-close-icon"></i>
  </button>

  <button id="ai-chat-float-btn" aria-label="问 AI">
    <i class="fas fa-robot"></i>
    <span>问 AI</span>
  </button>

  <aside id="ai-chat-sidebar" aria-hidden="true">
    <div id="ai-chat-header">
      <div id="ai-chat-header-title">
        <i class="fas fa-robot"></i>
        <span>AI 问答</span>
      </div>
      <button id="ai-chat-header-close" aria-label="关闭">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div id="ai-chat-messages">
      <div id="ai-chat-empty">
        <i class="fas fa-robot fa-2x" style="margin-bottom: 0.75rem; opacity: 0.5;"></i>
        <p>选中文章里的任意文字，点击“问 AI”开始提问。</p>
        <p style="font-size: 0.8rem;">也可以直接问我关于这篇文章的问题。</p>
      </div>
    </div>

    <div id="ai-chat-input-area">
      <div id="ai-chat-context-hint"></div>
      <div id="ai-chat-input-wrap">
        <textarea id="ai-chat-input" rows="1" placeholder="输入问题…"></textarea>
        <button id="ai-chat-send" aria-label="发送">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </aside>
</div>

<script>
(function () {
  'use strict';

  // DOM refs
  const root = document.getElementById('ai-chat-widget-root');
  const toggle = document.getElementById('ai-chat-toggle');
  const sidebar = document.getElementById('ai-chat-sidebar');
  const floatBtn = document.getElementById('ai-chat-float-btn');
  const messagesEl = document.getElementById('ai-chat-messages');
  const inputEl = document.getElementById('ai-chat-input');
  const sendBtn = document.getElementById('ai-chat-send');
  const headerClose = document.getElementById('ai-chat-header-close');
  const contextHint = document.getElementById('ai-chat-context-hint');
  const emptyState = document.getElementById('ai-chat-empty');

  // State
  let isOpen = false;
  let selectedText = '';
  let selectedParagraph = '';
  let sessionHistory = [];
  let isStreaming = false;
  let indexCache = null;
  let indexPromise = null;

  const AI_CHAT_ENDPOINT = '{{ site.ai_chat_endpoint | default: "https://ai-chat.zhchxiao123.workers.dev/api/chat" }}';
  const AI_CHAT_INDEX_URL = '{{ "/assets/js/data/ai-chat-index.json" | relative_url }}';

  // Load static RAG index
  async function loadIndex() {
    if (indexCache) return indexCache;
    if (indexPromise) return indexPromise;

    indexPromise = fetch(AI_CHAT_INDEX_URL)
      .then((res) => {
        if (!res.ok) throw new Error('Index load failed: ' + res.status);
        return res.json();
      })
      .then((data) => {
        indexCache = data;
        return data;
      })
      .catch((err) => {
        console.warn('[AI Chat] Failed to load index:', err);
        indexCache = { chunks: [] };
        return indexCache;
      });

    return indexPromise;
  }

  // Find relevant chunks by simple keyword overlap (MVP, no embeddings)
  function findRelevantChunks(query, currentUrl, maxChunks = 3) {
    if (!indexCache || !indexCache.chunks || indexCache.chunks.length === 0) return [];

    const stopWords = new Set([
      '的', '了', '是', '在', '和', '与', '或', '一个', '这个', '那个',
      '什么', '怎么', '为什么', '如何', '请', '你', '我', '它', '我们',
      'the', 'is', 'are', 'was', 'were', 'be', 'been', 'being', 'have', 'has',
      'had', 'do', 'does', 'did', 'a', 'an', 'the', 'this', 'that', 'these',
      'those', 'of', 'to', 'in', 'for', 'on', 'with', 'at', 'from', 'as',
      'and', 'or', 'but', 'not', 'no', 'yes'
    ]);

    const extractTokens = (text) => {
      if (!text) return [];
      const tokens = [];
      // CJK chars
      const cjk = text.match(/[一-鿿]/g) || [];
      tokens.push(...cjk);
      // Latin words
      const words = text.toLowerCase().match(/[a-z0-9]+/g) || [];
      tokens.push(...words.filter((w) => w.length > 2 && !stopWords.has(w)));
      return tokens;
    };

    const queryTokens = new Set(extractTokens(query));
    const selectedTokens = new Set(extractTokens(selectedText));
    const paraTokens = new Set(extractTokens(selectedParagraph));

    // Prefer chunks from the current article
    const samePageChunks = indexCache.chunks.filter((c) => c.url === currentUrl);
    const otherChunks = indexCache.chunks.filter((c) => c.url !== currentUrl);

    const scoreChunk = (chunk) => {
      const chunkTokens = new Set(extractTokens(chunk.text + ' ' + (chunk.heading || '')));
      let score = 0;
      for (const t of queryTokens) if (chunkTokens.has(t)) score += 3;
      for (const t of selectedTokens) if (chunkTokens.has(t)) score += 5;
      for (const t of paraTokens) if (chunkTokens.has(t)) score += 2;
      // Small boost for current page
      if (chunk.url === currentUrl) score *= 1.2;
      return score;
    };

    const scoredSame = samePageChunks.map((c) => ({ chunk: c, score: scoreChunk(c) }));
    const scoredOther = otherChunks.map((c) => ({ chunk: c, score: scoreChunk(c) }));

    scoredSame.sort((a, b) => b.score - a.score);
    scoredOther.sort((a, b) => b.score - a.score);

    const result = [];
    for (const { chunk, score } of scoredSame) {
      if (score <= 0 || result.length >= maxChunks) break;
      result.push({ ...chunk, _score: score });
    }
    for (const { chunk, score } of scoredOther) {
      if (score <= 0 || result.length >= maxChunks) break;
      result.push({ ...chunk, _score: score });
    }

    return result;
  }

  // Toggle sidebar
  function openSidebar() {
    isOpen = true;
    sidebar.classList.add('open');
    sidebar.setAttribute('aria-hidden', 'false');
    toggle.classList.add('open');
    inputEl.focus();
  }

  function closeSidebar() {
    isOpen = false;
    sidebar.classList.remove('open');
    sidebar.setAttribute('aria-hidden', 'true');
    toggle.classList.remove('open');
  }

  toggle.addEventListener('click', () => isOpen ? closeSidebar() : openSidebar());
  headerClose.addEventListener('click', closeSidebar);

  // Text selection handling
  function getSelectedInfo() {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    if (!text || text.length < 2 || text.length > 1200) return null;

    // Avoid showing inside the chat widget itself
    let node = sel.anchorNode;
    if (node && node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    if (node && node.closest('#ai-chat-widget-root')) return null;

    let paragraph = '';
    const range = sel.getRangeAt(0);
    let commonNode = range.commonAncestorContainer;
    if (commonNode.nodeType === Node.TEXT_NODE) commonNode = commonNode.parentElement;

    // Walk up to find paragraph-ish container inside article
    const article = commonNode.closest('article');
    const block = commonNode.closest('p, li, td, blockquote, h1, h2, h3, h4, h5, h6');
    if (block && article && article.contains(block)) {
      paragraph = block.textContent.trim();
    }

    const rect = range.getBoundingClientRect();
    if (rect.width === 0 && rect.height === 0) return null;
    return { text, paragraph, rect };
  }

  function updateFloatButton() {
    const info = getSelectedInfo();
    if (!info) {
      floatBtn.style.display = 'none';
      return;
    }

    const { text, paragraph, rect } = info;
    selectedText = text;
    selectedParagraph = paragraph;

    // Position near top-right of selection, with viewport clamping
    // Coordinates are viewport-relative because the float button is position:fixed.
    let top = rect.top - 42;
    let left = rect.right + 8;

    const btnWidth = 90;
    if (left + btnWidth > window.innerWidth) {
      left = rect.left - btnWidth - 8;
    }
    if (left < 4) left = 4;
    if (top < 4) top = rect.bottom + 8;

    floatBtn.style.top = top + 'px';
    floatBtn.style.left = left + 'px';
    floatBtn.style.display = 'flex';
  }

  let selectionTimeout;
  document.addEventListener('selectionchange', () => {
    clearTimeout(selectionTimeout);
    selectionTimeout = setTimeout(updateFloatButton, 120);
  });

  document.addEventListener('mousedown', (e) => {
    if (e.target.closest('#ai-chat-float-btn')) return;
    // Hide on click elsewhere; selectionchange will re-show if still selected
    floatBtn.style.display = 'none';
  });

  // Hide float button on scroll (user probably moved on)
  let scrollTimeout;
  window.addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      if (floatBtn.style.display !== 'none') {
        updateFloatButton();
      }
    }, 100);
  }, { passive: true });

  // Float button click: open sidebar and prefill context
  floatBtn.addEventListener('click', () => {
    openSidebar();
    if (selectedText) {
      showContextHint(selectedText);
      inputEl.focus();
    }
  });

  function showContextHint(text) {
    const preview = text.length > 60 ? text.slice(0, 60) + '…' : text;
    contextHint.textContent = '已选中上下文：' + preview;
    contextHint.classList.add('visible');
  }

  function clearContextHint() {
    selectedText = '';
    selectedParagraph = '';
    contextHint.textContent = '';
    contextHint.classList.remove('visible');
    window.getSelection().removeAllRanges();
    floatBtn.style.display = 'none';
  }

  // Message rendering
  function escapeHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function simpleMarkdownToHtml(md) {
    if (!md) return '';
    // Escape HTML first
    let html = escapeHtml(md);

    // Code blocks (fenced with optional language)
    html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
      return `<pre><code class="language-${lang || 'plaintext'}">${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code></pre>`;
    });

    // Inline code
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Bold
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    // Italic (single asterisks/underscores, avoid matching bold markers)
    html = html.replace(/(^|[\s(])\*([^*]+)\*([\s).,;!?]|$)/g, '$1<em>$2</em>$3');
    html = html.replace(/(^|[\s(])_([^_]+)_([\s).,;!?]|$)/g, '$1<em>$2</em>$3');

    // Links [text](url)
    html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

    // Lists (simple unordered)
    const listItems = [];
    html = html.replace(/^\s*[-*]\s+(.+)$/gm, (match, item) => {
      const marker = `__LI_${listItems.length}__`;
      listItems.push(`<li>${item}</li>`);
      return marker;
    });

    // Numbered lists
    html = html.replace(/^\s*\d+\.\s+(.+)$/gm, (match, item) => {
      const marker = `__LI_${listItems.length}__`;
      listItems.push(`<li>${item}</li>`);
      return marker;
    });

    // Paragraphs
    html = html.split(/\n\n+/).map(p => {
      p = p.trim();
      if (!p) return '';
      if (p.startsWith('<')) return p;
      return `<p>${p}</p>`;
    }).join('\n');

    // Restore list items wrapped in ul
    listItems.forEach((item, i) => {
      html = html.replace(`<p>__LI_${i}__</p>`, item);
    });

    // Wrap consecutive li into ul
    html = html.replace(/(<li>.*?<\/li>)(\s*<li>.*?<\/li>)*/g, (match) => `<ul>${match}</ul>`);

    return html;
  }

  function addMessage(role, content, isError = false) {
    if (emptyState) emptyState.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'ai-chat-message ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'ai-chat-bubble';
    if (isError) bubble.classList.add('ai-chat-error');

    const contentEl = document.createElement('div');
    contentEl.className = 'ai-chat-content';

    if (role === 'assistant' && !isError) {
      contentEl.innerHTML = simpleMarkdownToHtml(content);
    } else {
      contentEl.textContent = content;
    }

    bubble.appendChild(contentEl);
    msg.appendChild(bubble);

    const meta = document.createElement('div');
    meta.className = 'ai-chat-meta';
    meta.textContent = role === 'user' ? '你' : 'AI';
    msg.appendChild(meta);

    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    return contentEl;
  }

  function addLoading() {
    const msg = document.createElement('div');
    msg.className = 'ai-chat-message assistant';
    msg.id = 'ai-chat-loading';

    const bubble = document.createElement('div');
    bubble.className = 'ai-chat-bubble';
    bubble.innerHTML = '<div class="ai-chat-loading"><span></span><span></span><span></span></div>';

    msg.appendChild(bubble);
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeLoading() {
    const el = document.getElementById('ai-chat-loading');
    if (el) el.remove();
  }

  // Build context payload
  async function buildContext() {
    const index = await loadIndex();
    const currentUrl = new URL(window.location.href).pathname.replace(/\/$/, '') + '/';
    const relevantChunks = findRelevantChunks(inputEl.value.trim(), currentUrl);

    return {
      pageTitle: document.title,
      pageUrl: window.location.href,
      selectedText: selectedText,
      surroundingParagraph: selectedParagraph,
      relevantChunks: relevantChunks.map((c) => ({
        id: c.id,
        url: c.url,
        title: c.title,
        heading: c.heading,
        text: c.text,
      }))
    };
  }

  // Send message
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    addMessage('user', text);
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    isStreaming = true;
    addLoading();

    const context = await buildContext();
    const historyForApi = sessionHistory.slice(-6); // keep last 6 exchanges

    try {
      const response = await fetch(AI_CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: text,
          context: context,
          history: historyForApi
        })
      });

      removeLoading();

      if (!response.ok) {
        throw new Error('服务器响应异常：' + response.status);
      }

      const contentEl = addMessage('assistant', '');
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith('data:')) continue;
          const dataStr = trimmed.slice(5).trim();
          if (!dataStr) continue;

          try {
            const data = JSON.parse(dataStr);
            if (data.done) break;
            if (data.chunk) {
              fullText += data.chunk;
              contentEl.innerHTML = simpleMarkdownToHtml(fullText);
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            if (data.error) {
              throw new Error(data.error);
            }
          } catch (e) {
            // ignore malformed SSE lines
          }
        }
      }

      // Update session history
      sessionHistory.push({ role: 'user', content: text });
      sessionHistory.push({ role: 'assistant', content: fullText });

      // Clear selection context after first use
      clearContextHint();

    } catch (err) {
      removeLoading();
      addMessage('assistant', '出错了：' + err.message, true);
      console.error('[AI Chat]', err);
    } finally {
      isStreaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });

  inputEl.addEventListener('input', function () {
    this.style.height = 'auto';
    this.style.height = this.scrollHeight + 'px';
  });

  // Auto-resize sidebar on viewport change
  window.addEventListener('resize', () => {
    if (isOpen) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  });
})();
</script>
{% endif %}
